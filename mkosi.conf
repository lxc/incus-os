[Build]
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
History=yes
ToolsTree=default
CacheDirectory=mkosi.cache
WithNetwork=true

[Output]
ImageId=IncusOS
OutputDirectory=mkosi.output
Format=disk
SplitArtifacts=yes

[Distribution]
Distribution=debian
Release=trixie
Mirror=http://deb.debian.org
Repositories=non-free-firmware

[Validation]
SecureBoot=true
SecureBootAutoEnroll=true
SecureBootSignTool=systemd-sbsign
SecureBootKey=./mkosi.key
SecureBootCertificate=./mkosi.crt

SignExpectedPcr=true
VerityKey=./mkosi.key
VerityCertificate=./mkosi.crt

[Content]
Bootable=true
BaseTrees=%O/base
UnifiedKernelImages=unsigned
UnifiedKernelImageFormat=%i_%v
KernelCommandLine=rw
                  vt.handoff=1
                  intel_iommu=on
                  quiet
                  loglevel=0
                  systemd.show_status=0
                  rootflags=noexec,nodev,nosuid
                  audit=1
                  audit_backlog_limit=8192
                  rd.systemd.mount-extra=/dev/disk/by-partlabel/esp:/boot:vfat:rw
                  modprobe.blacklist=nvidiafb
                  systemd.image_policy=esp=unprotected:usr=signed:root=encrypted+absent:swap=encrypted+absent:=ignore
                  systemd.swap=0
KernelModulesInitrd=true
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=default
                           bfa
                           dm-service-time
                           /dwc3.ko
                           dwc3-of-simple
                           ehci-platform
                           regulator/fixed.ko
                           fnic
                           gpio-rockchip
                           /hid.ko
                           hid-generic
                           hpsa
                           hv_storvsc
                           i2c-rk3x
                           isofs
                           lpfc
                           megaraid_sas
                           mmc_block
                           mpi3mr
                           mptfc
                           ohci-platform
                           phy-rockchip-inno-usb2
                           phy-rockchip-naneng-combphy
                           phy-rockchip-snps-pcie3
                           qla2xxx
                           rk808-regulator
                           rk8xx-i2c
                           rockchip-iodomain
                           scsi_dh_alua
                           scsi_transport_sas
                           sdhci-acpi
                           sdhci-pci
                           smartpqi
                           tpm_vtpm_proxy
                           uas
                           usb-storage
                           usbhid
                           vmd
                           xhci-plat-hcd
InitrdPackages=initrd-utils
RemoveFiles=/boot/*zabbly*
            /boot/EFI/mkosi.der
