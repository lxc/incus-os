                "400":
                    $ref: '#/responses/BadRequest'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Create a volume
            tags:
                - system
    /1.0/system/storage/:delete-pool:
        post:
            consumes:
                - application/json
            description: Destroys a local storage pool.
            operationId: system_post_storage_delete_pool
            parameters:
                - description: The pool to be deleted
                  in: body
                  name: configuration
                  required: true
                  schema:
                    example:
                        name: mypool
                    type: object
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "400":
                    $ref: '#/responses/BadRequest'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Delete local pool
            tags:
                - system
    /1.0/system/storage/:delete-volume:
        post:
            consumes:
                - application/json
            description: Deletes a storage pool volume.
            operationId: system_post_storage_delete_volume
            parameters:
                - description: The volume to be deleted
                  in: body
                  name: configuration
                  required: true
                  schema:
                    example:
                        force: true
                        name: my-volume
                        pool: local
                    type: object
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "400":
                    $ref: '#/responses/BadRequest'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Delete a volume
            tags:
                - system
    /1.0/system/storage/:encrypt-drive:
        post:
            consumes:
                - application/json
            description: |-
                Wipes and encrypts a raw drive using a random LUKS key that will be used by the system to unlock on boot.
                Existing data on the drive will be opportunistically wiped via `blkdiscard` unless "secure_wipe" is true,
                which will guarantee all data is erased. On large spinning drives that don't support `blkdiscard`, securely
                wiping the drive may take a very long time.
            operationId: system_post_storage_encrypt_drive
            parameters:
                - description: The drive to be encrypted
                  in: body
                  name: configuration
                  required: true
                  schema:
                    $ref: '#/definitions/SystemStorageEncrypt'
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "400":
                    $ref: '#/responses/BadRequest'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Encrypt a raw drive
            tags:
                - system
    /1.0/system/storage/:import-encrypted-drive:
        post:
            consumes:
                - application/json
            description: Imports the encryption key needed for an existing encrypted drive.
            operationId: system_post_storage_import_encrypted_drive
            parameters:
                - description: The drive to be decrypted
                  in: body
                  name: configuration
                  required: true
                  schema:
                    $ref: '#/definitions/SystemStorageImportEncryptedDrive'
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "400":
                    $ref: '#/responses/BadRequest'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Import an existing encrypted drive
            tags:
                - system
    /1.0/system/storage/:import-pool:
        post:
            consumes:
                - application/json
            description: |-
                Imports an existing ZFS storage pool. For encrypted pools, this will save its encryption key,
                making the pool automatically available on each boot. The use of unencrypted pools is strongly
                discouraged, and each unencrypted pool must be manually imported after each boot.
            operationId: system_post_storage_import_pool
            parameters:
                - description: Existing pool information
                  in: body
                  name: configuration
                  required: true
                  schema:
                    $ref: '#/definitions/SystemStoragePoolKey'
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "400":
                    $ref: '#/responses/BadRequest'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Import an existing storage pool
            tags:
                - system
    /1.0/system/storage/:scrub-pool:
        post:
            consumes:
                - application/json
            description: Starts a scrub for a local storage pool.
            operationId: system_post_storage_scrub_pool
            parameters:
                - description: The pool to be scrubbed
                  in: body
                  name: configuration
                  required: true
                  schema:
                    example:
                        name: mypool
                    type: object
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "400":
                    $ref: '#/responses/BadRequest'
                "409":
                    $ref: '#/responses/Conflict'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Scrub local pool
            tags:
                - system
    /1.0/system/storage/:wipe-drive:
        post:
            consumes:
                - application/json
            description: |-
                Wipes all data from the specified drive. Existing data on the drive will be opportunistically wiped
                via `blkdiscard` unless "secure_wipe" is true, which will guarantee all data is erased. On large
                spinning drives that don't support `blkdiscard`, securely wiping the drive may take a very long time.
            operationId: system_post_storage_wipe_drive
            parameters:
                - description: The drive to be wiped
                  in: body
                  name: configuration
                  required: true
                  schema:
                    $ref: '#/definitions/SystemStorageWipe'
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "400":
                    $ref: '#/responses/BadRequest'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Wipe a drive
            tags:
                - system
