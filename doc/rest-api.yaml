info:
    contact:
        email: lxc-devel@lists.linuxcontainers.org
        name: IncusOS upstream
        url: https://github.com/lxc/incus-os
    description: |-
        This is the REST API used to manage and monitor IncusOS systems.

        The API is available over a local unix socket as well as over HTTPS
        through the primary application's API proxy (under the "/os" prefix)
        or through the fallback listener. Remote users authenticate with TLS
        client certificates.
    license:
        name: Apache-2.0
        url: https://www.apache.org/licenses/LICENSE-2.0
    title: IncusOS external REST API
    version: "1.0"
paths:
    /:
        get:
            description: Returns a list of supported API versions (URLs).
            operationId: api_get
            produces:
                - application/json
            responses:
                "200":
                    description: API endpoints
                    schema:
                        description: Sync response
                        properties:
                            metadata:
                                description: List of endpoints
                                example:
                                    - /1.0
                                items:
                                    type: string
                                type: array
                            status:
                                description: Status description
                                example: Success
                                type: string
                            status_code:
                                description: Status code
                                example: 200
                                type: integer
                            type:
                                description: Response type
                                example: sync
                                type: string
                        type: object
            summary: Get the supported API endpoints
            tags:
                - server
    /1.0:
        get:
            description: Returns a map with basic information about the server's environment.
            operationId: server_get
            produces:
                - application/json
            responses:
                "200":
                    description: Basic server environment
                    schema:
                        description: Sync response
                        properties:
                            metadata:
                                description: Basic server information
                                example:
                                    environment:
                                        hostname: af94e64e-1993-41b6-8f10-a8eebb828fce
                                        machine_id: af94e64e199341b68f10a8eebb828fce
                                        os_name: IncusOS
                                        os_version: "202511041601"
                                        os_version_alternate: "202511162345"
                                        os_version_next: "202511152230"
                                        system_is_ready: true
                                        uptime: "3237039"
                                type: object
                            status:
                                description: Status description
                                example: Success
                                type: string
                            status_code:
                                description: Status code
                                example: 200
                                type: integer
                            type:
                                description: Response type
                                example: sync
                                type: string
                        type: object
            summary: Get basic information about the server environment
            tags:
                - server
    /1.0/applications:
        get:
            description: Returns a list of currently installed applications (URLs).
            operationId: applications_get
            produces:
                - application/json
            responses:
                "200":
                    description: API endpoints
                    schema:
                        description: Sync response
                        properties:
                            metadata:
                                description: List of applications
                                example:
                                    - /1.0/applications/incus
                                items:
                                    type: string
                                type: array
                            status:
                                description: Status description
                                example: Success
                                type: string
                            status_code:
                                description: Status code
                                example: 200
                                type: integer
                            type:
                                description: Response type
                                example: sync
                                type: string
                        type: object
            summary: Get currently installed applications
            tags:
                - applications
        post:
            consumes:
                - application/json
            description: Installs a new application on the system.
            operationId: applications_post
            parameters:
                - description: Application to be installed
                  in: body
                  name: application
                  required: true
                  schema:
                    example:
                        name: gpu-support
                    type: object
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "400":
                    $ref: '#/responses/BadRequest'
                "404":
                    $ref: '#/responses/NotFound'
                "409":
                    $ref: '#/responses/Conflict'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Add an application
            tags:
                - applications
    /1.0/applications/{name}:
        get:
            description: Returns application-specific state and configuration information.
            operationId: applications_get_application
            parameters:
                - description: Application name
                  in: path
                  name: name
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: State and configuration for the application
                    schema:
                        description: Sync response
                        properties:
                            metadata:
                                description: State and configuration for the application
                                example:
                                    config: {}
                                    state:
                                        available_versions:
                                            - "202511041601"
                                            - "202511041800"
                                        friendly_version: 7.0.0 [202511041800]
                                        initialized: true
                                        is_primary: true
                                        version: "202511041800"
                                type: object
                            status:
                                description: Status description
                                example: Success
                                type: string
                            status_code:
                                description: Status code
                                example: 200
                                type: integer
                            type:
                                description: Response type
                                example: sync
                                type: string
                        type: object
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Get application-specific information
            tags:
                - applications
        put:
            description: Updates an application's configuration.
            operationId: applications_put_application
            parameters:
                - description: Application name
                  in: path
                  name: name
                  required: true
                  type: string
                - description: Application configuration
                  in: body
                  name: configuration
                  required: true
                  schema:
                    properties:
                        config:
                            description: The application configuration
                            example:
                                lxcfs:
                                    cpu_shares: false
                                    load_average: true
                            type: object
                    type: object
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Update application configuration
            tags:
                - applications
    /1.0/applications/{name}/:action:
        post:
            consumes:
                - application/json
            description: Triggers the given application to perform a specific task.
            operationId: applications_post_action
            parameters:
                - description: Application name
                  in: path
                  name: name
                  required: true
                  type: string
                - description: Action to perform
                  in: body
                  name: action
                  required: true
                  schema:
                    $ref: '#/definitions/ApplicationAction'
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Perform an application-specific action
            tags:
                - applications
    /1.0/applications/{name}/:backup:
        post:
            consumes:
                - application/json
            description: |-
                Generate and return a `gzip` compressed tar archive backup for the application.

                A full backup may be quite large depending on what artifacts or updates are locally cached by the application.
            operationId: applications_post_backup
            parameters:
                - description: Application name
                  in: path
                  name: name
                  required: true
                  type: string
                - description: Backup configuration
                  in: body
                  name: configuration
                  schema:
                    example:
                        complete: true
                    type: object
            produces:
                - application/json
                - application/gzip
            responses:
                "200":
                    description: gzip'ed tar archive
                    schema:
                        type: file
                "400":
                    $ref: '#/responses/BadRequest'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Generate an application backup
            tags:
                - applications
    /1.0/applications/{name}/:check-update:
        post:
            consumes:
                - application/json
            description: Trigger a manual check for an update of the given application, and apply it if found.
            operationId: applications_post_check_update
            parameters:
                - description: Application name
                  in: path
                  name: name
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Check for application update
            tags:
                - applications
    /1.0/applications/{name}/:debug:
        post:
            description: Triggers a debug action or debug data capture.
            operationId: applications_post_debug
            parameters:
                - description: Application name
                  in: path
                  name: name
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Perform debug actions or retrieve debug data for an application
            tags:
                - applications
    /1.0/applications/{name}/:factory-reset:
        post:
            description: Factory reset the application. This is a DESTRUCTIVE action and will wipe any local application configuration.
            operationId: applications_post_reset
            parameters:
                - description: Application name
                  in: path
                  name: name
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Perform a factory reset of the application
            tags:
                - applications
    /1.0/applications/{name}/:remove:
        post:
            description: Uninstall a non-primary application that is currently installed.
            operationId: applications_post_remove
            parameters:
                - description: Application to be removed
                  in: path
                  name: name
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Remove an application
            tags:
                - applications
    /1.0/applications/{name}/:restart:
        post:
            description: Triggers a restart of the application.
            operationId: applications_post_restart
            parameters:
                - description: Application name
                  in: path
                  name: name
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Restart an application
            tags:
                - applications
    /1.0/applications/{name}/:restore:
