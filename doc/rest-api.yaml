    /1.0/system/security:
        get:
            description: Returns information about the system's security state, such as Secure Boot and TPM status, encryption recovery keys, etc.
            operationId: system_get_security
            produces:
                - application/json
            responses:
                "200":
                    description: State and configuration for the system security
                    schema:
                        description: Sync response
                        properties:
                            metadata:
                                $ref: '#/definitions/SystemSecurity'
                            status:
                                description: Status description
                                example: Success
                                type: string
                            status_code:
                                description: Status code
                                example: 200
                                type: integer
                            type:
                                description: Response type
                                example: sync
                                type: string
                        type: object
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Get security information
            tags:
                - system
        put:
            consumes:
                - application/json
            description: |-
                Updates the list of encryption recovery keys. At least one recovery key must always be
                specified. Keys must be at least 15 characters long, contain at least one special
                character, and consist of at least five unique characters. Some other simple complexity
                checks are applied, and any key that doesn't pass will be rejected with an error.

                Optionally, specify one or more PEM-encoded custom CA certificates that should be added
                to the system's root trust. Only certificates specified in the API call will be persisted.
            operationId: system_put_security
            parameters:
                - description: Security configuration
                  in: body
                  name: configuration
                  required: true
                  schema:
                    $ref: '#/definitions/SystemSecurity'
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "400":
                    $ref: '#/responses/BadRequest'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Update system security configuration
            tags:
                - system
    /1.0/system/security/:tpm-rebind:
        post:
            description: Forcibly resets TPM encryption bindings; intended only for use if it was required to enter a recovery passphrase to boot the system.
            operationId: system_post_security_tpm_rebind
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/EmptySyncResponse'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Reset TPM bindings
            tags:
                - system
