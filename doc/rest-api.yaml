                - system
    /1.0/system/storage/:create-volume:
        post:
            consumes:
                - application/json
            description: Creates a new storage pool volume.
            operationId: system_post_storage_create_volume
            parameters:
                - description: The volume to be created
                  in: body
                  name: configuration
                  required: true
                  schema:
                    example:
                        name: my-volume
                        pool: local
                        quota: 0
